name: CI

# 仅在发布时运行：推送 v*（全量）或 <模块>-v*（如 datagrid-v12.1.5）标签触发；
# 也可通过 workflow_dispatch 手动打包或单包发布；日常提交不消耗 CI 配额。
on:
  push:
    tags:
      - 'v*'
      - '*-v*'
  workflow_dispatch:
    inputs:
      project:
        description: '要打包的项目（默认全解决方案；单包可填如 src/Piccolo.Forge.Avalonia.DataGrid/Piccolo.Forge.Avalonia.DataGrid.csproj）'
        required: false
        default: 'Piccolo.Forge.slnx'
        type: string
      publish:
        description: '是否推送到 NuGet（默认仅打包验证）'
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore Piccolo.Forge.slnx
      - run: dotnet build Piccolo.Forge.slnx --no-restore -c Release
      - run: dotnet test tests/Piccolo.Forge.Tests --no-build -c Release --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'

  pack:
    name: pack
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SourceLink 需要完整历史
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet pack "${{ inputs.project || 'Piccolo.Forge.slnx' }}" -c Release -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

  publish:
    name: publish to NuGet
    needs: pack
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    environment: nuget          # 与 nuget.org Trusted Publishing 策略里的 Environment 一致
    permissions:
      id-token: write           # OIDC：不用 API key
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: DUANDCHN
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
